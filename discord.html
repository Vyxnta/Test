async function prepareCloudValue(value,path='') {

  if(/^data:(image|audio|video|application|font)\//i.test(value)){
   try{return await uploadDataUrlToCloud(value,path||'asset');}
   catch(err){
    // No bloquear el guardado de todos los datos por un solo archivo. Se conserva
    // temporalmente el data URL dentro del JSON y se informa de la incidencia.
    cloudAssetFailures.push({path:path||'asset',message:String(err?.message||err||'Error multimedia')});
    console.warn('No se pudo subir un recurso multimedia; se conserva en los datos:',path,err?.message||err);
    return value;
   }
  }
  return value;
 }

 if(value&&typeof value==='object'){const out={};for(const [key,child] of Object.entries(value))out[key]=await prepareCloudValue(child,path?`${path}.${key}`:key);return out;}
 return value;
}
function explainCloudSaveError(err){
 const code=String(err?.code||err?.statusCode||'');
 const raw=String(err?.message||err?.details||err||'Error desconocido');
 const lower=(code+' '+raw).toLowerCase();
 if(lower.includes('user_app_data')&&(lower.includes('schema cache')||lower.includes('could not find the table')||lower.includes('does not exist')||lower.includes('pgrst205')||lower.includes('42p01')))
  return 'Falta la tabla public.user_app_data o Supabase aún no la detecta. Ejecuta completo SUPABASE_SETUP.sql en SQL Editor y vuelve a intentar.';
 if(lower.includes('row-level security')||lower.includes('rls')||code==='42501'||lower.includes('permission denied'))
  return 'Supabase rechazó el guardado por permisos (RLS). Ejecuta de nuevo SUPABASE_SETUP.sql en el proyecto correcto y revisa las políticas de user_app_data.';
 if(lower.includes('invalid api key')||lower.includes('apikey')||lower.includes('jwt'))
  return 'La clave pública de Supabase no es válida o la sesión expiró. Revisa supabase-config.json y vuelve a iniciar sesión.';
 if(lower.includes('payload too large')||lower.includes('request entity too large')||lower.includes('maximum allowed')||code==='413')
  return 'Los datos enviados son demasiado grandes. Comprime o reduce los archivos multimedia y vuelve a sincronizar.';
 if(lower.includes('bucket')||lower.includes('storage'))
  return 'Falló Supabase Storage. Ejecuta SUPABASE_SETUP.sql y confirma que exista el bucket discord-assets; detalle: '+raw;
 return 'Supabase respondió '+(code?'('+code+') ':'')+raw;
}
async function saveAccountDataToCloud(manual=false){

 if(cloudLoadInProgress){if(manual)showToast('La cuenta todavía se está cargando. Espera un momento e inténtalo otra vez.');return false;}
 if(cloudSaveBusy){cloudSaveRequested=true;if(manual)showToast('Ya hay una sincronización en curso; se guardarán también los cambios recientes.');return false;}

 try{
  const snapshot=clone(db);
  const cloudData=await prepareCloudValue(snapshot);
  const {error}=await supabaseClient.from('user_app_data').upsert({user_id:activeCloudUser.id,app_data:cloudData,schema_version:1,updated_at:nowISO()},{onConflict:'user_id'});
  if(error)throw error;
  cloudSaveWarningAt=0;
  try{localStorage.setItem(dbStorageKey,JSON.stringify(db));}catch(_e){}
  if(cloudAssetFailures.length){
   cloudSyncStatus='Datos sincronizados; algunos archivos no pudieron subirse';
   const first=cloudAssetFailures[0];
   cloudSyncError=`${cloudAssetFailures.length} archivo(s) no se pudieron subir a Storage. Se intentaron conservar dentro del guardado de la cuenta. Primer error (${first.path}): ${first.message}`;
   console.warn(cloudSyncError);
   if(manual)showToast('Datos guardados en la nube, pero falló la subida de '+cloudAssetFailures.length+' archivo(s). '+first.message);
  }else{
   cloudSyncStatus='Todo sincronizado con Supabase';cloudSyncError='';
   if(manual)showToast('Sincronización completada. Los datos de esta cuenta están guardados en Supabase.');
  }
  return true;
 }catch(err){
  console.error('No se pudo sincronizar el contenido con Supabase:',err);
  const detail=explainCloudSaveError(err);
  cloudSyncStatus='Error de sincronización';cloudSyncError=detail;
  const now=Date.now();
  if(manual||now-cloudSaveWarningAt>15000){cloudSaveWarningAt=now;showToast('No se pudo guardar en la nube: '+detail);}
  return false;
 }finally{
  cloudSaveBusy=false;
  if(cloudSaveRequested){cloudSaveRequested=false;scheduleCloudSave();}
 }
}

function renderMessagesHTML(messages){return messages.map((m,i)=>{const u=m.userId==='me'?db.profile:findUser(m.userId);const prev=messages[i-1];const grouped=!!(prev&&prev.userId===m.userId&&((new Date(m.createdAt)-new Date(prev.createdAt))>=0)&&((new Date(m.createdAt)-new Date(prev.createdAt))<60000));const avatar=m.avatar||u.avatar||'';const actualUser={...u,avatar,avatarDecoration:m.avatarDecoration||u.avatarDecoration};const reply=m.replyTo||m.reply_to;const replyHtml=reply?`<button type="button" class="message-reply-preview" data-action="jump-to-message" data-id="${esc(reply.id||'')}"><span>↪ ${esc(reply.username||'Respuesta')}</span><span>${esc(String(reply.content||'Adjunto o mensaje').slice(0,140))}</span></button>`:'';const body=[replyHtml,esc(m.content||'').replace(/\n/g,'<br>'),m.image?`<div class="attachment-card attachment-media"><img src="${esc(m.image)}" alt="Imagen adjunta" loading="lazy"></div>`:'',m.attachment?renderAttachment(m.attachment,m):'',m.poll?renderPoll(m.poll,m.id):''].filter(Boolean).join('');return `<div class="message ${grouped?'message-grouped':''}" data-message-id="${esc(m.id)}">${grouped?'<div class="message-avatar-spacer"></div>':`<button type="button" class="profile-open-avatar" data-action="open-user-profile" data-id="${esc(u.id)}" aria-label="Abrir perfil de ${esc(u.displayName||u.username||'Usuario')}">${avatarHTML(actualUser,40,'message-avatar')}</button>`}<div class="message-main">${grouped?'':`<div class="message-meta"><button type="button" class="message-name profile-name-button" data-action="open-user-profile" data-id="${esc(u.id)}">${esc(m.username||u.displayName||u.username||'Usuario')}</button><span class="message-time">${timeLabel(m.createdAt)}</span>${m.edited?'<span class="message-edited">(editado)</span>':''}</div>`}<div class="message-body">${body}</div><div class="message-actions"><button type="button" data-action="reply-message" data-id="${esc(m.id)}" aria-label="Responder a este mensaje">↩ Responder</button></div></div></div>`;}).join('');}
async function hydrateChatAttachments(){const nodes=$$('.attachment-placeholder[data-attachment-id]');for(const node of nodes){if(!node.isConnected)continue;const id=node.dataset.attachmentId,found=findAttachmentMessage(id),att=found?.message?.attachment;if(!att)continue;let src=att.dataUrl||att.cloudUrl||'';if(!src){let url=attachmentURLs.get(id);if(!url){const blob=await getAttachmentBlob(id);if(blob){url=URL.createObjectURL(blob);attachmentURLs.set(id,url);}}src=url||'';}if(!node.isConnected)continue;if(src)node.outerHTML=renderAttachmentBody(att,src);else node.innerHTML=`${icon('file',20)} ${esc(att.name||'Archivo')} · vista previa no disponible <button class="icon-btn" data-action="download-attachment" data-id="${esc(id)}">${icon('download',16)}</button>`;}}
async function hydrateCustomDecorations(){for(const node of $$('[data-decoration-custom="true"][data-decoration-id]')){if(node.dataset.loaded==='1')continue;const id=node.dataset.decorationId;let src=node.dataset.src||'';const found=db.profile.avatarDecoration;if(found?.custom&&(found.blobId===id||found.id===id))src=found.cloudUrl||found.dataUrl||src;if(!src){const blob=await getAttachmentBlob(id);if(blob){src=attachmentURLs.get('deco:'+id)||'';if(!src){src=URL.createObjectURL(blob);attachmentURLs.set('deco:'+id,src);}}}if(src){node.src=src;node.dataset.loaded='1';}}}

async function handlePickedFiles(files,mode){for(const file of Array.from(files||[])){if(!file)continue;if(file.size>25*1024*1024){showToast(file.name+' supera el límite de 25 MB.');continue;}const ext=fileExtension(file.name),isText=file.type.startsWith('text/')||['js','mjs','cjs','jsx','ts','tsx','py','hx','lua','hscript','java','kt','kts','cs','cpp','cc','cxx','c','h','hpp','rs','go','php','rb','swift','dart','gd','html','htm','css','scss','json','xml','yaml','yml','toml','sql','sh','bash','ps1','bat','md','txt','ini','conf','hxml','hxsl'].includes(ext);const MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/opus',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',pdf:'application/pdf',zip:'application/zip',json:'application/json',txt:'text/plain',md:'text/markdown'};const mime=file.type||MIME_BY_EXT[ext]||'application/octet-stream';const id=uid('att');let att={id,name:file.name||('archivo.'+ext),type:mime,size:file.size||0,extension:ext,kind:'file'};if(isText){if(file.size>700*1024){showToast(file.name+' es demasiado grande para vista previa de texto (máx. 700 KB).');continue;}const text=await file.text();att.kind='code';att.textContent=text.slice(0,40000);att.language=inferLanguage(file.name,text);att.symbols=findCodeSymbols(text);att.truncated=text.length>40000;att.size=file.size;const codeBlob=new Blob([text],{type:mime.startsWith('text/')?mime:'text/plain'});if(activeCloudUser){try{att.cloudUrl=await uploadBlobToCloud(codeBlob,state.activeView==='dms'?'attachments':'server-media',file.name);}catch(err){console.warn('No se pudo subir el archivo de texto/código:',err.message);}}const codeSaved=await putAttachmentBlob(id,codeBlob);if(!codeSaved){if(text.length<=160000)att.sourceText=text;else{showToast('No se pudo guardar el código completo porque IndexedDB no está disponible; archivo omitido.');continue;}}if(!att.symbols.length&&att.language==='Código fuente detectado')att.language=CODE_EXTENSIONS[ext]||'Código';}else{const ok=await putAttachmentBlob(id,file);if(!ok){if(file.size>420*1024&&!activeCloudUser){showToast('El navegador no permite guardar archivos grandes aquí. Prueba con uno menor de 420 KB.');continue;}if(file.size<=420*1024){try{att.dataUrl=await fileAsDataURL(file);}catch(e){if(!activeCloudUser){showToast('No se pudo leer '+file.name);continue;}}}}if(activeCloudUser){try{att.cloudUrl=await uploadBlobToCloud(file,state.activeView==='dms'?'attachments':'server-media',file.name);}catch(err){console.warn('No se pudo subir el adjunto:',err.message);if(!att.dataUrl){showToast('El archivo quedó solo en este dispositivo porque no se pudo subir a la nube.');}}}}const channel=state.activeView==='dms'?activeDM():activeChannel();if(!channel){showToast('Selecciona un canal primero.');continue;}const message={id:uid('msg'),userId:'me',username:db.profile.displayName||db.profile.username,avatar:db.profile.avatar||'',avatarDecoration:clone(db.profile.avatarDecoration),content:'',createdAt:nowISO(),attachment:att};(db.messages[channel.id]??=[]).push(message);const ctx=state.activeView==='dms'?{kind:'dm',localId:channel.id}:{kind:'channel',localId:channel.id,serverId:activeServer()?.id};void publishMessageToCloud(message,ctx);if(state.activeView==='dms'){channel.lastMessage='Archivo adjunto: '+file.name;channel.updatedAt=nowISO();}activity('message','Adjuntaste '+file.name);persist();}render();state.mobileScreen='chat';$('#app').dataset.mobile='chat';const sc=$('#chatScroll');if(sc)sc.scrollTop=sc.scrollHeight;await hydrateChatAttachments();showToast('Adjuntos enviados.');}

function isUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||''));}

async function uploadCloudVisual(value,key){const str=String(value||'');if(/^data:/i.test(str)){const blob=dataUrlToBlob(str);if(!blob)throw new Error('No se pudo leer la imagen.');return await uploadBlobToCloud(blob,storageCategory(key),safeStorageName(key));}if(/^https?:\/\//i.test(str))return str;return null;}
async function ensureServerPublished(server){
 if(!activeCloudUser||!supabaseClient||!server)return null;
 if(server.owner==='invite')return server.cloudId||null;
 const sid=server.cloudId||`srv:${activeCloudUser.id}:${safeStorageName(server.id)}`;
 server.cloudId=sid;
 for(const ch of (server.channels||[])){if(!ch.cloudId)ch.cloudId=`ch:${sid}:${safeStorageName(ch.id)}`;}
 const signature=JSON.stringify([server.name,server.description,server.color,server.icon,server.banner,(server.channels||[]).map(c=>[c.id,c.cloudId,c.name,c.type,c.category,c.topic])]);
 if(server._cloudSignature===signature)return sid;
 const iconUrl=await uploadCloudVisual(server.icon,`server.icon.${server.id}`);
 const bannerUrl=await uploadCloudVisual(server.banner,`server.banner.${server.id}`);
 const row={id:sid,owner_id:activeCloudUser.id,name:String(server.name||'Servidor').slice(0,70),description:String(server.description||'').slice(0,300),color:/^#[0-9a-f]{6}$/i.test(server.color||'')?server.color:'#5865f2',icon_url:iconUrl,banner_url:bannerUrl,updated_at:nowISO()};
 let result=await supabaseClient.from('app_servers').upsert(row,{onConflict:'id'});
 if(result.error)throw result.error;
 result=await supabaseClient.from('app_server_members').upsert({server_id:sid,user_id:activeCloudUser.id,role:'owner'},{onConflict:'server_id,user_id',ignoreDuplicates:true});
 if(result.error)throw result.error;
 const channelRows=(server.channels||[]).map((c,index)=>({id:c.cloudId,server_id:sid,name:String(c.name||'general').slice(0,70),type:['text','voice','forum'].includes(c.type)?c.type:'text',category:String(c.category||'canales de texto').slice(0,60),topic:String(c.topic||'').slice(0,200),position:index}));
 if(channelRows.length){result=await supabaseClient.from('app_channels').upsert(channelRows,{onConflict:'id'});if(result.error)throw result.error;}
 const {data:existingChannels,error:existingChannelsError}=await supabaseClient.from('app_channels').select('id').eq('server_id',sid);if(existingChannelsError)throw existingChannelsError;const desiredChannelIds=new Set(channelRows.map(c=>c.id));const staleChannelIds=(existingChannels||[]).map(c=>c.id).filter(id=>!desiredChannelIds.has(id));if(staleChannelIds.length){const {error:deleteChannelsError}=await supabaseClient.from('app_channels').delete().eq('server_id',sid).in('id',staleChannelIds);if(deleteChannelsError)throw deleteChannelsError;}
 server._cloudSignature=JSON.stringify([server.name,server.description,server.color,server.icon,server.banner,(server.channels||[]).map(c=>[c.id,c.cloudId,c.name,c.type,c.category,c.topic])]);
 try{localStorage.setItem(dbStorageKey,JSON.stringify(db));}catch(_e){}
 if(!cloudLoadInProgress)scheduleCloudSave();
 return sid;
}
async function initializeCloudWorkspace(){
 if(!activeCloudUser||!supabaseClient)return;
 for(const server of db.servers||[]){
  try{if(server.owner==='invite'&&server.cloudId)await refreshCloudServerMetadata(server,false);else await ensureServerPublished(server);}
  catch(err){console.warn('No se pudo preparar el servidor compartido:',server.name,err?.message||err);continue;}
  for(const channel of server.channels||[]){
   for(const message of db.messages[channel.id]||[]){if(message.userId==='me'&&!message.cloudSynced)await publishMessageToCloud(message,{kind:'channel',localId:channel.id,serverId:server.id});}
  }
 }
 for(const dm of db.dms||[]){
  if(!isUuid(dm.userId)||dm.userId===activeCloudUser.id)continue;
  try{await ensureDirectConversation(dm);for(const message of db.messages[dm.id]||[]){if(message.userId==='me'&&!message.cloudSynced)await publishMessageToCloud(message,{kind:'dm',localId:dm.id});}}catch(err){console.warn('No se pudo migrar el historial de MD:',err?.message||err);}
 }
 try{persist();}catch(_e){}
}
async function loadCloudConversations(shouldRender=true){
 if(!activeCloudUser||!supabaseClient)return;
 try{
  const {data:ownRows,error:ownError}=await supabaseClient.from('app_conversation_members').select('conversation_id').eq('user_id',activeCloudUser.id).limit(1000);
  if(ownError)throw ownError;
  const ids=[...new Set((ownRows||[]).map(r=>r.conversation_id).filter(Boolean))];
  if(!ids.length)return;
  const {data:otherRows,error:otherError}=await supabaseClient.from('app_conversation_members').select('conversation_id,user_id').in('conversation_id',ids).neq('user_id',activeCloudUser.id).limit(2000);
  if(otherError)throw otherError;

function isPublicSupabaseKey(value){
 const key=String(value||'').trim();
 if(key.startsWith('sb_secret_'))return false;
 if(key.startsWith('sb_publishable_'))return true;
 if(!key.startsWith('eyJ'))return false;
 try{
  let part=key.split('.')[1];if(!part)return false;
  part=part.replace(/-/g,'+').replace(/_/g,'/');while(part.length%4)part+='=';
  const payload=JSON.parse(atob(part));
  return payload.role==='anon';
 }catch(_e){return false;}
}
function validSupabaseConfig(config){return !!(config&&typeof config.projectUrl==='string'&&/^https:\/\/[a-zA-Z0-9.-]+(?::\d+)?\/?$/.test(config.projectUrl.trim())&&isPublicSupabaseKey(config.publishableKey));}

async function handleConfigConnect(fd){
 const config={projectUrl:String(fd.get('projectUrl')||'').trim().replace(/\/$/,''),publishableKey:String(fd.get('publishableKey')||'').trim()};
 if(!validSupabaseConfig(config)){authMessage='La URL no parece válida o la clave no es pública. Usa sb_publishable_... o la clave anon. No uses service_role.';renderAuthScreen();return;}
 try{await initializeSupabase(config,true);}catch(err){authMessage=err.message||'No se pudo conectar con Supabase.';supabaseClient=null;renderAuthScreen();}
}
async function initializeSupabase(config,save=true){
 if(!validSupabaseConfig(config))throw new Error('Configuración inválida. Revisa projectUrl y la clave pública.');
 if(!window.supabase?.createClient)throw new Error('No se pudo cargar supabase-js desde Internet. Revisa tu conexión y vuelve a cargar la página.');
 cloudConfig={projectUrl:String(config.projectUrl).trim().replace(/\/$/,''),publishableKey:String(config.publishableKey).trim()};
 supabaseClient=window.supabase.createClient(cloudConfig.projectUrl,cloudConfig.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
 if(save){try{localStorage.setItem(SUPABASE_CONFIG_KEY,JSON.stringify(cloudConfig));}catch(_e){}}
 if(authSubscription?.unsubscribe)authSubscription.unsubscribe();
 authSubscription=supabaseClient.auth.onAuthStateChange((event,session)=>{
  authSession=session||null;
  if(event==='PASSWORD_RECOVERY'){recoveryPending=true;authViewMode='reset';authMessage='';renderAuthScreen('reset','');return;}
  if(session?.user){activeCloudUser=session.user;if(event==='USER_UPDATED'&&$('#app').style.display!=='none'){render();return;}if(lastActivatedUserId!==session.user.id)void activateAppForSession(session.user);}
  else{activeCloudUser=null;lastActivatedUserId='';if($('#app').style.display!=='none'||!$('#authRoot').innerHTML)renderAuthScreen('signup','');else renderAuthScreen(authViewMode,authMessage);}
 });
 const {data,error}=await supabaseClient.auth.getSession();
 if(error)throw error;
 authSession=data.session||null;
 if(authSession?.user){if(recoveryPending||authViewMode==='reset'){renderAuthScreen('reset',authMessage||'');}else await activateAppForSession(authSession.user);}
 else{lastActivatedUserId='';authViewMode='signup';renderAuthScreen('signup','');}
}

 if(stored){db=stored;dbStorageKey=key;try{localStorage.setItem('discord_local_clone_v1_migrated_to_accounts','1');}catch(_e){}}

  db=loadDb();dbStorageKey=key;migratedLegacy=true;

 }else{

  try{localStorage.setItem('discord_local_clone_v1_migrated_to_accounts','1');}catch(_e){}
  const meta=user.user_metadata||{};const emailName=String(user.email||'').split('@')[0]||'usuario';
  db.profile.username=String(meta.username||emailName).trim().slice(0,32)||emailName;

 }

 cloudLoadInProgress=true;let cloudDataFound=false;
 try{
  const {data:cloudState,error:cloudStateError}=await supabaseClient.from('user_app_data').select('app_data').eq('user_id',user.id).maybeSingle();
  if(cloudStateError)throw cloudStateError;
  const saved=cloudState?.app_data;
  if(saved&&saved.version===1&&saved.profile&&Array.isArray(saved.servers)){
   db={...clone(initial),...saved,profile:{...clone(initial.profile),...(saved.profile||{})},settings:{...clone(initial.settings),...(saved.settings||{})},messages:saved.messages&&typeof saved.messages==='object'?saved.messages:{},servers:Array.isArray(saved.servers)?saved.servers:clone(initial.servers),users:Array.isArray(saved.users)?saved.users:[],friends:Array.isArray(saved.friends)?saved.friends:[],dms:Array.isArray(saved.dms)?saved.dms:[],activities:Array.isArray(saved.activities)?saved.activities:[],wishlist:Array.isArray(saved.wishlist)?saved.wishlist:[],profileTabs:{...clone(initial.profileTabs),...(saved.profileTabs||{})}};
   dbStorageKey=key;cloudDataFound=true;
   try{localStorage.setItem(dbStorageKey,JSON.stringify(db));}catch(_e){}
  }
 }catch(err){console.warn('No se pudo cargar el guardado completo de Supabase. Ejecuta SUPABASE_SETUP.sql actualizado:',err.message);}
 finally{cloudLoadInProgress=false;}
 migrateVisualAssets();
 try{
  const {data,error}=await supabaseClient.from('profiles').select(PROFILE_SELECT).eq('id',user.id).maybeSingle();
  if(error){console.warn('Supabase profiles:',error.message);}
  if(data&&!migratedLegacy){applyCloudProfileToLocal(data);persist();await syncOwnProfile(true);}
  else{
   const meta=user.user_metadata||{};const emailName=String(user.email||'').split('@')[0]||'usuario';
   if(!migratedLegacy){db.profile.username=String(meta.username||db.profile.username||emailName).slice(0,32);db.profile.displayName=String(meta.display_name||meta.username||db.profile.displayName||emailName).slice(0,60);}

 $('#authRoot').style.display='none';$('#app').style.display='flex';
 ensureSelections();render();

 if(!cloudDataFound)scheduleCloudSave();
}
function applyCloudProfileToLocal(row){
 if(!row)return;
 db.profile.username=String(row.username||db.profile.username||'usuario');
 db.profile.displayName=String(row.display_name||row.username||db.profile.displayName||'Usuario');
 db.profile.bio=String(row.bio||'');db.profile.status=String(row.status||'online');
 if(row.avatar_url&&visualAsset(row.avatar_url))db.profile.avatar=row.avatar_url;
 if(row.banner_url&&visualAsset(row.banner_url))db.profile.banner=row.banner_url;
 if(row.avatar_decoration&&typeof row.avatar_decoration==='object')db.profile.avatarDecoration=row.avatar_decoration;
 db.profile.id='me';
}
async function syncOwnProfile(silent=false){

 const p=db.profile;const avatar=String(p.avatar||'');const banner=String(p.banner||'');
 let avatarUrl=/^https?:\/\//i.test(avatar)?avatar:null;

 if(/^data:/i.test(avatar)){try{avatarUrl=await uploadDataUrlToCloud(avatar,'profile.avatar');}catch(err){console.warn('No se pudo subir el avatar a Storage:',err.message);avatarUrl=null;}}
 if(/^data:/i.test(banner)){try{bannerUrl=await uploadDataUrlToCloud(banner,'profile.banner');}catch(err){console.warn('No se pudo subir el banner a Storage:',err.message);bannerUrl=null;}}
 let avatarDecoration=null;try{if(p.avatarDecoration){const decoration=clone(p.avatarDecoration);if(decoration&&/^https?:\/\//i.test(String(decoration.cloudUrl||'')))decoration.dataUrl=decoration.cloudUrl;const failuresBefore=cloudAssetFailures.length;avatarDecoration=await prepareCloudValue(decoration,'profile.avatarDecoration');if(cloudAssetFailures.length>failuresBefore&&avatarDecoration&&/^data:/i.test(String(avatarDecoration.dataUrl||''))){avatarDecoration.dataUrl='';avatarDecoration.cloudUrl='';}}}catch(err){console.warn('No se pudo guardar la decoración del avatar en Storage:',err?.message||err);}
 const row={id:activeCloudUser.id,username:String(p.username||activeCloudUser.email?.split('@')[0]||'usuario').trim().slice(0,32),display_name:String(p.displayName||p.username||'Usuario').trim().slice(0,60),bio:String(p.bio||'').slice(0,1500),avatar_url:avatarUrl,banner_url:bannerUrl,avatar_decoration:avatarDecoration,status:['online','idle','dnd','offline'].includes(p.status)?p.status:'online',updated_at:nowISO()};
 const {error}=await supabaseClient.from('profiles').upsert(row,{onConflict:'id'});
 if(error){console.warn('No se pudo guardar el perfil en Supabase:',error.message);if(!silent)showToast('El perfil se guardó localmente, pero no se sincronizó. Comprueba SUPABASE_SETUP.sql y que el usuario único no esté ocupado.');return;}
 try{localStorage.setItem(dbStorageKey,JSON.stringify(db));}catch(_e){}
 await loadCloudProfiles(false);
}

async function handleSignUp(fd){

 const username=String(fd.get('username')||'').trim().replace(/^@/,'');const displayName=String(fd.get('displayName')||'').trim();const email=String(fd.get('email')||'').trim();const password=String(fd.get('password')||'');const confirmPassword=String(fd.get('passwordConfirm')||'');
 if(!/^[\p{L}\p{N}_.-]{3,32}$/u.test(username)){authMessage='El usuario debe tener entre 3 y 32 caracteres: letras, números, punto, guion o guion bajo.';renderAuthScreen('signup');return;}
 if(password.length<8){authMessage='La contraseña debe tener al menos 8 caracteres.';renderAuthScreen('signup');return;}
 if(password!==confirmPassword){authMessage='Las contraseñas no coinciden.';renderAuthScreen('signup');return;}
 authMessage='Creando cuenta…';renderAuthScreen('signup');startGlobalLoading('Creando tu cuenta…');
 let signupResult;
 try{signupResult=await supabaseClient.auth.signUp({email,password,options:{data:{username,display_name:displayName||username},emailRedirectTo:location.protocol==='http:'||location.protocol==='https:'?location.href.split('#')[0]:undefined}});}
 catch(err){stopGlobalLoading();authMessage='No se pudo conectar para crear la cuenta. Revisa tu conexión e inténtalo de nuevo.';renderAuthScreen('signup');return;}
 stopGlobalLoading();
 const {data,error}=signupResult;
 if(error){
   const mailError=String(error.message||'').toLowerCase();
   authMessage=(mailError.includes('confirmation email')||mailError.includes('sending email')||mailError.includes('smtp'))
    ? 'La cuenta no pudo terminar de registrarse porque Supabase no logró enviar el correo de confirmación. En Supabase, revisa Authentication → SMTP Settings / proveedor de correo y los límites de envío. Para pruebas, puedes desactivar Confirm email en Authentication → Providers → Email; no es recomendable para producción. Después, vuelve a intentarlo.'
    : (error.message||'No se pudo crear la cuenta. Inténtalo de nuevo.');
   renderAuthScreen('signup');return;
 }
 if(data.session&&data.user){authSession=data.session;await activateAppForSession(data.user);showToast('Cuenta creada.');}
 else{authViewMode='login';authMessage='Cuenta creada. Revisa tu correo para confirmar la dirección y después inicia sesión.';renderAuthScreen('login');}
}

async function bootSupabaseAuth(){

  try{const response=await fetch('./supabase-config.json',{cache:'no-store'});if(response.ok){const parsed=await response.json();cloudConfig=parsed;if(validSupabaseConfig(parsed))config=parsed;else authMessage='Edita supabase-config.json con la URL real y una clave pública.';}}catch(_e){}
 }
 if(!config){try{const saved=localStorage.getItem(SUPABASE_CONFIG_KEY);if(saved){const parsed=JSON.parse(saved);if(validSupabaseConfig(parsed))config=parsed;}}catch(_e){}}
 if(config){try{await initializeSupabase(config,false);return;}catch(err){supabaseClient=null;authMessage=err.message||'No se pudo inicializar Supabase.';}}
 else if(!authMessage)authMessage=location.protocol==='file:'?'Carga supabase-config.json desde el botón de abajo.':'Completa supabase-config.json o cárgalo con el botón de abajo.';

 if(status)status.textContent=label;
 if(fact){fact.textContent=loadingFacts[loadingFactIndex%loadingFacts.length];loadingFactIndex++;}
 loadingPercentValue=0;
 if(percent)percent.textContent='0 %';
 layer.classList.add('visible');
 if(loadingPercentTimer)clearInterval(loadingPercentTimer);
 loadingPercentTimer=setInterval(()=>{
   loadingPercentValue=Math.min(95,loadingPercentValue+Math.max(1,Math.round((95-loadingPercentValue)*.07)));
   const el=document.getElementById('loading-percent');
   if(el)el.textContent=loadingPercentValue+' %';
 },180);
}
function stopGlobalLoading(){
 const layer=document.getElementById('global-loading');
 if(layer)layer.classList.remove('visible');
 if(loadingPercentTimer){clearInterval(loadingPercentTimer);loadingPercentTimer=null;}
}
document.getElementById('loading-skip')?.addEventListener('click',stopGlobalLoading);

startGlobalLoading('Conectando con Supabase…');
bootSupabaseAuth().finally(stopGlobalLoading);
</script>
